<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#243169">
  <title>Offline · FoneFlex</title>
  <link rel="icon" href="assets/icon.svg">
  <link rel="stylesheet" href="assets/app.css">
  <style>body{min-height:100vh;display:grid;place-items:center;padding:22px}.offline-card{max-width:460px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center;box-shadow:var(--shadow)}.offline-mark{width:54px;height:54px;margin:0 auto 16px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:27px;font-weight:900}.offline-card h1{font-size:23px;margin:0 0 9px}.offline-card p{color:var(--muted);line-height:1.7}.offline-card button{margin-top:12px;border:0;border-radius:9px;background:var(--navy);color:#fff;padding:12px 18px;font-weight:700}</style>
</head>
<body>
  <main class="offline-card">
    <div class="offline-mark">F</div>
    <h1>You are offline</h1>
    <p>FoneFlex needs an internet connection to load customer records, verify payments, update agreements and communicate with device-management providers.</p>
    <p>Your private customer and payment information is not stored for offline access on this device.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
